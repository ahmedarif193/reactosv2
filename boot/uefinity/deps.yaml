# Uefinity Third-Party Dependencies Configuration
# ==============================================
#
# This file defines all third-party libraries used by the Uefinity bootloader.
# Each library entry supports the following fields:
#
# repository: Git repository URL (required)
# branch:     Branch name to checkout (optional, default: master)
# tag:        Tag name to checkout (optional, overrides branch)
# commit:     Specific commit hash (optional, overrides branch/tag)
# directory:  Target directory name in 3rdparty/ (optional, default: library name)
#
# Examples:
# - Use latest master:     branch: master (or omit branch)
# - Use specific branch:   branch: feature-branch
# - Use tagged release:    tag: v1.2.3
# - Use specific commit:   commit: abc123def456...
#
# Note: Only one of branch/tag/commit should be specified per library.

thirdpartylibs:
  # rapidyaml - Fast YAML parser/emitter library
  # Used for configuration file parsing and bootloader settings
  rapidyaml:
    repository: "https://github.com/biojppm/rapidyaml.git"
    branch: "master"
    directory: "rapidyaml"

